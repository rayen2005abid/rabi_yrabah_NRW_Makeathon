services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
    ports:
      - "5432:5432"
    volumes:
      - warehouse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://warehouse:warehouse@db:5432/warehouse
      CONFIG_DIR: /config
      EMBEDDED_MODE: mock
      CV_MIN_CONFIDENCE: "0.80"
      AUTO_SEED_DEMO: "true"
    volumes:
      - ./config:/config:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh","-c","alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  warehouse_pgdata:
